[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-evals-cli"
version = "0.1.0"
description = "Lightweight CLI tool for running repeatable LLM evaluation suites."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "llm-evals-cli contributors" },
]
keywords = ["llm", "eval", "testing", "cli", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer==0.12.5",
  "rich==13.9.4",
  "httpx==0.27.2",
  "pydantic==2.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.6.9",
  "mypy==1.11.2",
]

[project.scripts]
evals = "llm_evals_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evals_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
